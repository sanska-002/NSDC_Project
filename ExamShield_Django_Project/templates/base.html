<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ExamShield{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/static/css/site.css" rel="stylesheet"></head>
<body><nav class="navbar navbar-expand-lg navbar-dark topbar"><div class="container"><a class="navbar-brand fw-bold" href="/">◈ ExamShield</a><div class="ms-auto d-flex gap-3 align-items-center">
{% if user.is_authenticated %}<a href="/results/" class="nav-link text-white">My Results</a><span class="text-white-50">{{ user.username }}</span><form method="post" action="/accounts/logout/">{% csrf_token %}<button class="btn btn-sm btn-outline-light">Log out</button></form>{% else %}<a class="btn btn-sm btn-light" href="/accounts/login/">Student Login</a>{% endif %}
</div></div></nav>
<main class="container py-5">{% if messages %}{% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main>
<footer class="text-center text-secondary py-4 small">ExamShield · Online assessment demo</footer></body></html>
